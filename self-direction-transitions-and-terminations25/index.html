 to provider-managed care. These steps include re-educating the individual on self-direction, discussing additional supports needed for success, and cautioning that continued challenges may result in discontinuation of self-direction. Only after these steps are completed should documentation be submitted to the Ohio Department of Medicaid for approval of the transition.","voiceCode":"en-US-BrianNeural","language":"en","originalResourceId":"nWZzsWaqmNNhRbSFJ","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-BrianNeural\">When an individual experiences challenges with self-direction, the Ohio Department of Medicaid expects the care manager to complete specific steps before initiating a transition to provider-managed care. These steps include re-educating the individual on self-direction, discussing additional supports needed for success, and cautioning that continued challenges may result in discontinuation of self-direction. Only after these steps are completed should documentation be submitted to the Ohio Department of Medicaid for approval of the transition.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"When an individual experiences challenges with self-direction,","startTime":0.079,"finishTime":3.259},{"text":"the Ohio Department of Medicaid expects the care manager to","startTime":3.69,"finishTime":7.05},{"text":"complete specific steps before initiating","startTime":7.05,"finishTime":9.289},{"text":"a transition to provider-managed care.","startTime":9.289,"finishTime":11.43},{"text":"These steps include re-educating the individual on self-direction,","startTime":11.689,"finishTime":15.13},{"text":"discussing additional supports needed for success.","star
