10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-MichelleNeural\">What happens after you report an incident or suspected non-compliance? We have a duty to investigate reported concerns. Reports are directed to the Compliance Division, which conducts an objective and unbiased investigation. The Compliance Officer may interview the people involved, the person who made the report, and anyone else who may have relevant information. Subject-matter experts may also be consulted. The Compliance Division reminds leaders that retaliation against an employee who makes a good-faith report is prohibited. Once the investigation is complete, the Compliance Division consults with HR, supervisors, and the CEO, as appropriate, and makes recommendations. If requested, we will protect the reporter’s identity and confidentiality to the extent permitted by law. In rare and serious circumstances, we may be legally required to disclose the reporter’s identity.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"What happens after you report an incident or suspected noncompliance?","startTime":0.119,"finishTime":3.609},{"text":"We have a duty to investigate reported concerns.","startTime":4.409,"finishTime":7.11},{"text":"Reports are directed to the compliance division,","startTime":7.9399999999999995,"finishTime":10.18},{"text":"which conducts an objective and unbiased investigation.","startTime":10.38,"finishTime":13.3},{"text":"The compliance officer may interview the people involved,","startTime":14.1,"finishTime":16.899},{"text":"the person who made the report,","startTime":17.03,"finishTime":18.409},{"text":"and anyone else who may have relevant information.","startTime":18.579,"finishTime":20.819},{"text":"Subject matter experts may also be consu T13:55:09.360Z","dateModified":"2026-10-23T13:55:12.433Z"},"users":{"_userCreatorID":"P8bj8BqgzCgCGZYmC","_userModifierID":"P8bj8BqgzCgCGZYmC"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"What is your obligation to report non-compliance? Compliance is everyone’s responsibility, and that responsibility includes prevention, detection, and correction. When you notice a potential problem—whether it involves fraud, waste, abuse, or another type of non-compliance—you must report it. Other examples include concerns involving grant administration, program requirements, privacy, or anything that appears unethical, illegal, or inappropriate.\nYou do not have to be certain that something is non-compliant before reporting it. Even if you only suspect a concern, report it so we can assess and investigate the situation. We have established policies and processes for conducting investigations and acting on the findings. If the concern is substantiated, we will address it and appreciate that it was reported. If it is not substantiated, we will still appreciate the report and be relieved that there was no compliance issue. Please report anything that appears unethical, illegal, or inappropriate.\n","voiceCode":"en-US-MichelleNeural","language":"en","originalResourceId":"ggQeDXXMLym3YaCsd","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-MichelleNeural\">What is your obligation to report non-compliance? Compliance is everyone’s responsibility, and that responsibility includes prevention, detection, and correction. When you notice a potential problem—whether it involves fraud, waste, abuse, or another type of non-compliance—you must report it. Other examples include concerns involving grant administration, program requirements, privacy, or anything that appears unethical, illegal, or inappropriate.\u003cbreak time=\"0.5s\"/>You do not have to be certain that something is non-compliant before reporting it. Even if you only suspect a concern, report it so we can assess and investigate the situation. We have established policies and processes for conducting investigations and acting on the findings. If the concern is substantiated, we will address it and appreciate that it was reported. If it is not substantiated, we will still appreciate the report and be relieved that there was no compliance issue. Please report anything that appears unethical, illegal, or inappropriate.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"What is your obligation to report noncompliance?","startTime":0.09,"finishTime":2.65},{"text":"Compliance is everyone's responsibility,","startTime":3.43,"finishTime":5.59},{"text":"and that responsibility includes prevention,","startTime":5.75,"finishTime":7.829},{"text":"detection,","startTime":8.029,"finishTime":8.55},{"text":"and correction.","startTime":8.71,"finishTime":9.43},{"text":"When you notice a potential problem,","startTime":10.3,"finishTime":11.979},{"text":"whether it involves fraud,","startTime":12.189,"finishTime":13.42},{"text":"waste,","startTime":13.659,"finishTime":14.069},{"text":"abuse,","startTime":14.229,"finishTime":14.859},{"text":"or another type of noncompliance,","startTime":15.069,"finishTime":16.93},{"text":"you must report it.","startTime":17.149,"finishTime":18.03},{"text":"Other examples include concerns involving grant administration,","startTime":18.889,"finishTime":22.159},{"text":"program requirements,","startTime":22.59,"finishTime":23.52},{"text":"privacy,","startTime":23.68,"finishTime":24.36},{"text":"or anything that appears unethical,","startTime":24.52,"finishTime":26.25},{"text":"illegal,","startTime":26.409,"finishTime":26.969},{"text":"or inappropriate.","startTime":27.129,"finishTime":28.049},{"text":"You do not have to be certain that something is noncompliant before reporting it.","startTime":29.379,"finishTime":32.909},{"text":"Even if you only suspect a concern,","startTime":33.75,"finishTime":35.63},{"text":"report it so we can assess and investigate the situation.","startTime":35.99,"finishTime":38.709},{"text":"We have established policies and processes for","startTime":39.599,"finishTime":41.939},{"text":"conducting investigations and acting on the findings.","startTime":41.939,"finishTime":44.979},{"text":"If the concern is substantiated,","startTime":45.52,"finishTime":47.31},{"text":"we will address it and appreciate that it was reported.","startTime":47.479,"finishTime":49.84},{"text":"If it is not substantiated,","startTime":50.58,"finishTime":52.25},{"text":"we will still appreciate the report and be","startTime":52.419,"finishTime":54.24},{"text":"relieved that there was no compliance issue.","startTime":54.24,"finishTime":56.24},{"text":"Please report anything that appears unethical,","startTime":57.169,"finishTime":59.369},{"text":"illegal,","startTime":59.529,"finishTime":60.119},{"text":"or inappropriate.","startTime":60.29,"finishTime":61.209}]}},"DHZ8HRLxtAgMjRojv":{"_id":"DHZ8HRLxtAgMjRojv","_siteID":"ZoiyEJNGnnXpx9Jbx","isArchived":true,"isVisible":true,"isBuiltin":false,"isSampleData":false,"workspaceId":"oPYJFRcZXq3TGjd6g","thumbnail":"NwXJLDmCDSeLp6DLg","data":{"attributes":{"mimetype":"image/jpeg","status":"online","type":"image","uploadedFileName":"Image","uploadedFileNameExtension":".jpg","width":1254,"height":1254},"dates":{"dateCreated":"2026-10-23T13:29:59.014Z","dateModified":"2026-10-23T13:29:59.014Z"},"users":{"_userCreatorID":"P8bj8BqgzCgCGZYmC","_userModifierID":"P8bj8BqgzCgCGZYmC"}}},"GStKJSvGG9Jus24Wb":{"_id":"GStKJSvGG9Jus24Wb","_siteID":"ZoiyEJNGnnXpx9Jbx","isArchived":true,"isVisible":true,"isBuilt ent, the CEO, and the Board for evaluating the program’s effectiveness. It does this by reviewing audit results, monitoring performance metrics, establishing key compliance indicators, identifying potential deficiencies, and promoting prompt corrective action when concerns are suspected or identified. The Committee meets quarterly. Reports include aggregate data and do not identify individual employees because our goal is to correct and prevent issues at the system level. Any metric that falls below the established performance level for two consecutive quarters or reaches 70% or below in a single quarter requires a Corrective Action Plan.\nThe Compliance Committee also approves our annual risk assessment to ensure that we are addressing critical areas of concern. The Committee identifies, evaluates, and responds to compliance-related trends and problems. For example, it may discuss penalties, HIPAA issues, hotline reports, or other concerns that arise during the quarter. The Committee includes Compliance leaders, senior leaders, subject-matter experts who are familiar with their respective areas, and a Board member.\n","voiceCode":"en-US-MichelleNeural","language":"en","originalResourceId":"6Co9keaEw7xJfWi9w","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-MichelleNeural\">The Compliance Committee supports the Compliance Officer in reviewing and overseeing the Compliance Program. The Committee is accountable to senior management, the CEO, and the Board for evaluating the program’s effectiveness. It does this by reviewing audit results, monitoring performance metrics, establishing key compliance indicators, identifying potential deficiencies, and promoting prompt corrective action when concerns are suspected source":"textToSpeech","textToSpeechData":{"prompt":"You may ask yourself, what does compliance have to do with me and my role here at Direction Home? Compliance programs were developed to help organizations prevent and address fraud. In healthcare, organizations must have safeguards and processes in place to prevent, detect, and correct not only fraud, but also waste and abuse. Healthcare services are funded by federal and state dollars through programs such as Medicaid and Medicare. Waivers, including our PASSPORT, Assisted Living, and Next Generation MyCare programs, are generally funded by Medicaid, while Title III services are funded through the Older Americans Act. We must follow the regulations associated with these programs so that funds are protected and used for their intended purpose: consumer care and services.\nThat is why compliance is less like a roadblock and more like the brakes that make speed possible. These safeguards help us move forward confidently, responsibly, and effectively while keeping consumer care at the center of our work.\nCompliance also helps control costs by reducing the risk of fines and penalties associated with our contracts and regulations. Payors—including our managed care partners, Medicaid, and Medicare—may impose penalties when we do not meet contractual obligations. Money spent on avoidable penalties cannot be used to support consumer services. Knowing the requirements, monitoring our performance, and addressing issues promptly help protect both our resources and the people we serve.\n","voiceCode":"en-US-MichelleNeural","language":"en","originalResourceId":"rd5cXoWFJXFkfyJna","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-MichelleNeural\">You may ask yourself, w le for another person.","startTime":24.52,"finishTime":27.92}]}},"y34xcvdoWZph5gx36":{"_id":"y34xcvdoWZph5gx36","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":2774016,"uploadedFileName":"Michelle-en-Untitled-10232026.mp3","uploadedFileNameExtension":".mp3","duration":115.5375},"dates":{"dateCreated":"2026-10-23T13:52:47.863Z","dateModified":"2026-10-23T13:52:50.521Z"},"users":{"_userCreatorID":"P8bj8BqgzCgCGZYmC","_userModifierID":"P8bj8BqgzCgCGZYmC"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"Monitoring and auditing require ongoing review of regulations and contracts to identify the requirements and metrics that must be audited. Contracts can change regularly. If we do not keep up with those changes, we may miss important compliance requirements. We must continually review applicable regulations and signed contracts, then communicate relevant changes so employees understand what they are expected to do.\nAs noted earlier, we conduct audits of each program. We audit agency operations except for Ombudsman, HR, IT, and Fiscal. Those divisions self-monitor by conducting their own audits and reporting the findings to Compliance. Audit results must lead to action. We communicate results to divisions by email, during monthly team meetings, and at quarterly Compliance Committee meetings. We also communicate findings to individual employees and their supervisors so that non-compliance can be corrected promptly. If you receive an email about an audit finding, you are expected to correct it. Our goal is to identify non-compliance or omissions, correct them promptly, and prevent them from recurring. Internal audits are designed to help us improve; they are not punitive or intended for external use. Aggregate audit scores—not employee-specific findings—are reported to the Compliance Committee and the Board.\nThe auditing process helps us identify trends and patterns, which informs prevention efforts. Examples of items audited by Compliance include timely consumer visits, annual signatures on Waiver Consent forms, consistency between waiver service plans and case notes, and timely documentation of significant events and incident reports. When an audit identifies a problem, the responsible division determines the root cause and develops correction and prevention plans. Everyone at Direction Home plays a role in keeping our agency compliant.\n","voiceCode":"en-US-MichelleNeural","language":"en","originalResourceId":"xKNRSLCJkK6b5JwMg","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-MichelleNeural\">Monitoring and auditing require ongoing review of regulations and contracts to identify the requirements and metrics that must be audited. Contracts can change regularly. If we do not keep up with those changes, we may miss important compliance requirements. We must continually review applicable regulations and signed contracts, then communicate relevant changes so employees understand what they are expected to do.\u003cbreak time=\"0.5s\"/>As noted earlier, we conduct audits of each program. We audit agency operations except for Ombudsman, HR, IT, and Fiscal. Those divisions self-monitor by conducting their own audits and reporting the findings to Compliance. Audit results must lead to action. We communicate results to divisions by email, during monthly team meetings, and at quarterly Compliance Committee meetings. We also communicate findings to individual employees and their supervisors so that non-compliance can be corrected promptly. If you receive an email about an audit finding, you are expected to corr ntify individual employees because our","startTime":30.899,"finishTime":33.31},{"text":"goal is to correct and prevent issues at the system level.","startTime":33.31,"finishTime":36.009},{"text":"Any metric that falls below the established","startTime":36.84,"finishTime":39.169},{"text":"performance level for 2 consecutive quarters or","startTime":39.169,"finishTime":41.369},{"text":"reaches 70% or below in a single quarter requires a corrective action plan.","startTime":41.369,"finishTime":45.79},{"text":"The compliance committee also approves our annual risk assessment to","startTime":47.099,"finishTime":50.659},{"text":"ensure that we are addressing critical areas of concern.","startTime":50.659,"finishTime":53.159},{"text":"The committee identifies,","startTime":53.959,"finishTime":55.279},{"text":"evaluates,","startTime":55.47,"finishTime":56.159},{"text":"and responds to compliance-related trends and problems.","startTime":56.279,"finishTime":59.259},{"text":"For example,","startTime":60.09,"finishTime":60.849},{"text":"it may discuss penalties,","startTime":61.009,"finishTime":62.369},{"text":"HIPAA issues,","startTime":62.59,"finishTime":63.479},{"text":"hotline reports,","startTime":63.729,"finishTime":64.65},{"text":"or other concerns that arise during the quarter.","startTime":64.769,"finishTime":67.01},{"text":"The committee includes compliance leaders,","startTime":67.8,"finishTime":69.879},{"text":"senior leaders,","startTime":70.04,"finishTime":71},{"text":"subject matter experts who are familiar with their respective areas,","startTime":71.4,"finishTime":74.199},{"text":"and a board member.","startTime":74.36,"finishTime":75.309}]}},"assets":["JYxnjfbMDvfep8ykY"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The Compliance Committee supports the Compliance Officer in reviewing and overseeing the Compliance Program. The Committee is accountable to senior management, the CEO, and the Board for evaluating the program’s effectiveness. It does this by reviewing audit results, monitoring performance metrics, establishing key compliance indicators, identifying potential deficiencies, and promoting prompt corrective action when concerns are suspected or identified. The Committee meets quarterly. Reports include aggregate data and do not identify individual employees because our goal is to correct and prevent issues at the system level. Any metric that falls below the established performance level for two consecutive quarters or reaches 70% or below in a single quarter requires a Corrective Action Plan.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-MichelleNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The Compliance Committee also approves our annual risk assessment to ensure that we are addressing critical areas of concern. The Committee identifies, evaluates, and responds to compliance-related trends and problems. For example, it may discuss penalties, HIPAA issues, hotline reports, or other concerns that arise during the quarter. The Committee includes Compliance leaders, senior leaders, subject-matter experts who are familiar with their respective areas, and a Board member.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-MichelleNeural\",\"rate\":1}},{\"children\":[],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-MichelleNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","voiceCodeUsed":"en-US-MichelleNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"promptText":"The Compliance Committee supports the Compliance Officer in reviewing and overseeing the Compliance Program. The Committee is accountable to senior management, the CEO, and the Board for evaluating the program’s effectiveness. It does this by reviewing audit results, monitoring performance metrics, establishing key compliance indicators, identifying potential deficiencies, and promoting prompt corrective action when concerns are suspected or identified. The Committee meets quarterly. Reports include aggregate data and do not identify individual employees because our goal is to correct and prevent issues at the system level. Any metric that falls below the established performance level for two consecutive quarters or reaches 70% or below in a single quarter requires a Corrective Action Plan.\nThe Compliance Committee also approves our annual risk assessment to ensure that we are addressing critical areas of concern. The Committee identifies, evaluates, and responds to compliance-related trends and problems. For example, it may discuss penalties, HIPAA issues, hotline reports, or other concerns that arise during the quarter. The Committee includes Compliance leaders, senior leaders, subject-matter experts who are familiar with their respective areas, and a Board member.\n","jobId":"FWwb5kkhpNN2ar4dE"}},"AijLmC4en3F86NpSy":{"_id":"AijLmC4en3F86NpSy","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"locale":"en","template":"resourceSlide","title":"Untitled","upload":"xa9EWLcBwm5KYGKc7"},"dates":{"dateCreated":"2026-10-23T13:30:00.095Z","dateModified":"2026-10-23T19:24:51.830Z"},"users":{"_userCreatorID":"P8bj8BqgzCgCGZYmC","_userModifierID":"P8bj8BqgzCgCGZYmC"},"video":{"autoPlay":true,"overlays":[{"identifier":"aiFwf5tpi8dBwjNeb","kind":"overlay","htmlContent":"\u003cdiv>\u003cspan style=\"color:rgba(48, 27, 59, 1)\">Good-faith reporting has protection\u003c/span>\u003c/di 33.75,"finishTime":35.63},{"text":"report it so we can assess and investigate the situation.","startTime":35.99,"finishTime":38.709},{"text":"We have established policies and processes for","startTime":39.599,"finishTime":41.939},{"text":"conducting investigations and acting on the findings.","startTime":41.939,"finishTime":44.979},{"text":"If the concern is substantiated,","startTime":45.52,"finishTime":47.31},{"text":"we will address it and appreciate that it was reported.","startTime":47.479,"finishTime":49.84},{"text":"If it is not substantiated,","startTime":50.58,"finishTime":52.25},{"text":"we will still appreciate the report and be","startTime":52.419,"finishTime":54.24},{"text":"relieved that there was no compliance issue.","startTime":54.24,"finishTime":56.24},{"text":"Please report anything that appears unethical,","startTime":57.169,"finishTime":59.369},{"text":"illegal,","startTime":59.529,"finishTime":60.119},{"text":"or inappropriate.","startTime":60.29,"finishTime":61.209}]}},"assets":["BpyHjNbYx2pr5mMxr"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"What is your obligation to report non-compliance? Compliance is everyone’s responsibility, and that responsibility includes prevention, detection, and correction. When you notice a potential problem—whether it involves fraud, waste, abuse, or another type of non-compliance—you must report it. Other examples include concerns involving grant administration, program requirements, privacy, or anything that appears unethical, illegal, or inappropriate.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-MichelleNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"You do not have to be certain that something is non-compliant before reporting it. Even if you only suspect a concern, report it so we can assess and investigate the situation. We have established policies and processes for conducting investigations and acting on the findings. If the concern is substantiated, we will address it and appreciate that it was reported. If it is not substantiated, we will still appreciate the report and be relieved that there was no compliance issue. Please report anything that appears unethical, illegal, or inappropriate.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-MichelleNeural\",\"rate\":1}},{\"children\":[],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-MichelleNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","voiceCodeUsed":"en-US-MichelleNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"promptText":"What is your obligation to report non-compliance? Compliance is everyone’s responsibility, and that responsibility includes prevention, detection, and correction. When you notice a potential problem—whether it involves fraud, waste, abuse, or another type of non-compliance—you must report it. Other examples include concerns involving grant administration, program requirements, privacy, or anything that appears unethical, illegal, or inappropriate.\nYou do not have to be certain that something is non-compliant before reporting it. Even if you only suspect a concern, report it so we can assess and investigate the situation. We have established policies and processes for conducting investigations and acting on the findings. If the concern is substantiated, we will address it and appreciate that it was reported. If it is not substantiated, we wil ess fraud.","startTime":8.029,"finishTime":9.63},{"text":"In healthcare,","startTime":10.55,"finishTime":11.399000000000001},{"text":"organizations must have safeguards and processes in place to prevent,","startTime":12.22,"finishTime":14.989},{"text":"detect,","startTime":15.229,"finishTime":15.789},{"text":"and correct not only fraud,","startTime":15.909,"finishTime":17.5},{"text":"but also waste and abuse.","startTime":17.67,"finishTime":19.239},{"text":"Healthcare services are funded by federal and state","startTime":20.09,"finishTime":22.62},{"text":"dollars through programs such as Medicaid and Medicare.","startTime":22.62,"finishTime":25.299},{"text":"Waivers,","startTime":26.239,"finishTime":26.79},{"text":"including our passport,","startTime":27.09,"finishTime":28.159},{"text":"assisted living,","startTime":28.45,"finishTime":29.19},{"text":"and next generation MyCare programs","startTime":29.329,"finishTime":31.51},{"text":"are generally funded by Medicaid,","startTime":31.649,"finishTime":33.4},{"text":"while Title III services are funded through the Older Americans Act.","startTime":33.639,"finishTime":37.11},{"text":"We must follow the regulations associated with these programs so","startTime":37.95,"finishTime":41.119},{"text":"that funds are protected and used for their intended purpose,","startTime":41.119,"finishTime":43.849},{"text":"consumer care and services.","startTime":44.08,"finishTime":45.849},{"text":"That is why compliance is less like a roadblock","startTime":47.15,"finishTime":49.5},{"text":"and more like the brakes that make speed possible.","startTime":49.5,"finishTime":51.54},{"text":"These safeguards help us move forward confidently,","startTime":52.569,"finishTime":55.119},{"text":"responsibly,","startTime":55.25,"finishTime":56.09},{"text":"and effectively while keeping consumer care at the center of our work.","startTime":56.25,"finishTime":59.31},{"text":"Compliance also helps control costs by reducing the risk of","startTime":60.81,"finishTime":64.209},{"text":"fines and penalties associated with our contracts and regulations.","startTime":64.209,"finishTime":67.989},{"text":"Payers,","startTime":68.639,"finishTime":69.25},{"text":"including our managed care partners,","startTime":69.65,"finishTime":71.209},{"text":"Medicaid","startTime":71.41,"finishTime":72.11},{"text":"and Medicare,","startTime":72.25,"finishTime":73.01},{"text":"may impose penalties when we do not meet contractual obligations.","startTime":73.18,"finishTime":76.75},{"text":"Money spent on avoidable penalties cannot be used to support consumer services.","startTime":77.65,"finishTime":81.889},{"text":"Knowing the requirements,","startTime":82.639,"finishTime":83.83},{"text":"monitoring our performance,","startTime":83.919,"finishTime":85.23},{"text":"and addressing issues promptly help protect both","startTime":85.44,"finishTime":87.68},{"text":"our resources and the people we serve.","startTime":87.68,"finishTime":89.819}]}},"assets":["X5NSkdo9ZYPSBfAvm"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"You may ask yourself, what does compliance have to do with me and my role here at Direction Home? Compliance programs were developed to help organizations prevent and address fraud. In healthcare, organizations must have safeguards and processes in place to prevent, detect, and correct not only fraud, but also waste and abuse. Healthcare services are funded by federal and state dollars through programs such as Medicaid and Medicare. Waivers, including our PASSPORT, Assisted Living, and Next Generation MyCare programs, are generally funded by Medicaid, while Title III services are funded through the Older Americans Act. We must follow the regulations associated with these programs so that funds are protected and used for their intended purpose: consumer care and services.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-MichelleNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"That is why compliance is less like a roadblock and more like the brakes that make speed possible. These safeguards help us move forward confidently, responsibly, and effectively while keeping consumer care at the center of our work.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-MichelleNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Compliance also helps control costs by reducing the risk of fines and penalties associated with our contracts and regulations. Payors—including our managed care partners, Medicaid, and Medicare—may impose penalties when we do not meet contractual obligations. Money spent on avoidable penalties cannot be used to support consumer services. Knowing the requirements, monitoring our performance, and addressing issues promptly help protect both our resources and the people we serve.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-MichelleNeural\",\"rate\":1}},{\"children\":[],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-MichelleNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","voiceCodeUsed":"en-US-MichelleNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"promptText":"You may ask yourself, what does compliance have to do with me and my role here at Direction Home? Compliance programs were developed to help organizations prevent and address fraud. In healthcare, organizations must have safeguards and processes in place to prevent, detect, and correct not only fraud, but also waste and abuse. Healthcare services are funded by federal and state dollars through programs such as Medicaid and Medicare. Waivers, including our PASSPORT, Assisted Living, and Next Generation MyCare programs, are generally funded by Medicaid, while Title III services are funded through the Older Americans Act. We must follow the regulations associated with these programs so that funds are protected and used for their intended purpose: consumer care and services.\nThat is why compliance is less like a roadblock and more like the brakes that make speed possible. These safeguards help us move forward confidently, responsibly, and effectively while keeping consumer care at the center of our work.\nCompliance also helps control costs by reducing the risk of fines and penalties associated with our contracts and regulations. Payors—including our managed care partners, Medicaid, and Medicare—may impose penalties when we do not meet contractual obligations. Money spent on avoidable penalties cannot be used to support consumer services. Knowing the requirements, monitoring our performance, and addressing issues promptly help protect both our resources and the people we serve.\n","jobId":"NSAYfuFbPifKqQJn6"}},"rvwGNnkfAKWaDCYQq":{"_id":"rvwGNnkfAKWaDCYQq","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"locale":"en","template":"resourceSlide","title":"Untitled","upload":"ykk5yQPMn8kskuo2X"},"dates":{"dateCreated":"2026-10-23T13:30:00.167Z","dateModified":"2026-10-23T19:12:21.560Z"},"users":{"_userCreatorID":"P8bj8BqgzCgCGZYmC","_userModifierID":"P8bj8BqgzCgCGZYmC"},"video":{"autoPlay":true,"overlays":[{"identifier":"Yde7sZhgCH9EuXjBa","kind":"overlay","htmlContent":"\u003cdiv>\u003cspan style=\"color:rgba(48, 27, 59, 1)\">Corrective action includes prevention\u003 es sent there go directly to the compliance team.","startTime":21.25,"finishTime":23.93},{"text":"The compliance reporting tab is also available on the employee portal as","startTime":24.76,"finishTime":28.399},{"text":"well as a link in the Nax One compliance hub page.","startTime":28.399,"finishTime":31.02},{"text":"If you are uncomfortable reporting directly to someone at the agency,","startTime":31.84,"finishTime":35.08},{"text":"you may report anonymously through the hotline either by","startTime":35.25,"finishTime":38.08},{"text":"phone or through the NAVEx One Policy platform.","startTime":38.08,"finishTime":40.38},{"text":"The outside vendor managing the hotline sends the","startTime":41.369,"finishTime":43.97},{"text":"report to the compliance officer for review,","startTime":43.97,"finishTime":46.119},{"text":"and it follows the investigation process described earlier.","startTime":46.29,"finishTime":49.11}]}},"assets":["hqwBr2CjKe26BTP2r","JotyoDrw2MbAp45cC"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"You may be wondering: How do I report a compliance concern?\",\"type\":\"text\",\"version\":1},{\"type\":\"textToSpeechBreak\",\"version\":1,\"duration\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-MichelleNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"There are several ways to report a concern. You may report it in person to the Compliance Officer, a supervisor, the CEO, or any member of the Executive Team. You may also contact the Compliance Help Desk at compliancehelp@dhad.org; messages sent there go directly to the Compliance Team. The Compliance Reporting tab is also available on the employee portal as well as a link in the NAVEX One Compliance Hub page. If you are uncomfortable reporting directly to someone at the agency, you may report anonymously through the Hotline, either by phone or through the NAVEX One Policy Platform. The outside vendor managing the Hotline sends the report to the Compliance Officer for review, and it follows the investigation process described earlier\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-MichelleNeural\",\"rate\":1}},{\"children\":[],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-MichelleNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"You may be wondering: How do I report a compliance concern?\nThere are several ways to report a concern. You may report it in person to the Compliance Officer, a supervisor, the CEO, or any member of the Executive Team. You may also contact the Compliance Help Desk at compliancehelp@dhad.org; messages sent there go directly to the Compliance Team. The Compliance Reporting tab is also available on the employee portal as well as a link in the NAVEX One Compliance Hub page. If you are uncomfortable reporting directly to someone at the agency, you may report anonymously through the Hotline, either by phone or through the NAVEX One Policy Platform. The outside vendor managing the Hotline sends the report to the Compliance Officer for review, and it follows the investigation process described earlier\n","voiceCodeUsed":"en-US-MichelleNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":true,"isAdjustingSpeed":false},"jobId":"ApC6xyb54ia9DsYtc"}},"uoEPYLjnbGsCAPJPe":{"_id":"uoEPYLjnbGsCAPJPe","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"locale":"en","template":"resourceSlide","title":"Untitled","upload":"rR6sAaPg3YPpdgd9x"},"dates":{"dateCreated" order":{"color":"koantic(accent1, 5, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"fill":{"type":"color","color":"transparent"},"padding":{"bottom":3.428571428571429,"top":3.428571428571429,"left":6.857142857142858,"right":6.857142857142858},"fontColor":"rgba(48, 27, 59, 1)"}}],"background":{"backgroundColor":"rgba(248, 244, 235, 1)","backgroundImageOpacity":100},"duration":115.5375,"captions":[{"text":"Monitoring and auditing require ongoing review of regulations and contracts","startTime":0.17,"finishTime":4.09},{"text":"to identify the requirements and metrics that must be audited.","startTime":4.09,"finishTime":7.05},{"text":"Contracts can change regularly.","startTime":7.9,"finishTime":9.67},{"text":"If we do not keep up with those changes,","startTime":10.529,"finishTime":12.529},{"text":"we may miss important compliance requirements.","startTime":12.739,"finishTime":15.119},{"text":"We must continually review applicable regulations and signed contracts,","startTime":15.899000000000001,"finishTime":19.649},{"text":"then communicate relevant changes so employees understand","startTime":19.899,"finishTime":22.819},{"text":"what they are expected to do.","startTime":22.819,"finishTime":24.04},{"text":"As noted earlier,","startTime":25.45,"finishTime":26.44},{"text":"we conduct audits of each program.","startTime":26.7,"finishTime":28.54},{"text":"We audit agency operations except for ombudsman,","startTime":29.389,"finishTime":32.15},{"text":"HR,","startTime":32.348,"finishTime":32.79},{"text":"IT,","startTime":32.95,"finishTime":33.49},{"text":"and fiscal.","startTime":33.669,"finishTime":34.389},{"text":"Those divisions self-monitor by conducting their own","startTime":35.29,"finishTime":37.81},{"text":"audits and reporting the findings to compliance.","startTime":37.81,"finishTime":40.29},{"text":"Audit results must lead to action.","startTime":40.97,"finishTime":42.97},{"text":"We communicate results to divisions by email,","startTime":43.84,"finishTime":46.22},{"text":"during monthly team meetings,","startTime":46.529,"finishTime":48.02},{"text":"and at quarterly compliance committee meetings.","startTime":48.08,"finishTime":50.38},{"text":"We also communicate findings to individual employees and their","startTime":51.159,"finishTime":54.29},{"text":"supervisors so that noncompliance can be corrected promptly.","startTime":54.29,"finishTime":57.349},{"text":"If you receive an email about an audit finding,","startTime":58.139,"finishTime":60.58},{"text":"you are expected to correct it.","startTime":60.74,"finishTime":62.139},{"text":"Our goal is to identify noncompliance or omissions,","startTime":62.979,"finishTime":66.099},{"text":"correct them promptly,","startTime":66.339,"finishTime":67.3},{"text":"and prevent them from recurring.","startTime":67.48,"finishTime":68.86},{"text":"Internal audits are designed to help us improve.","startTime":69.65,"finishTime":72.029},{"text":"They are not punitive or intended for external use.","startTime":72.449,"finishTime":75.129},{"text":"Aggregate audit scores,","startTime":75.83,"finishTime":77.349},{"text":"not employeespecific findings,","startTime":77.589,"finishTime":79.339},{"text":"are reported to the compliance committee and the board.","startTime":79.589,"finishTime":81.919},{"text":"The auditing process helps us identify trends and patterns,","startTime":83.19,"finishTime":86.62},{"text":"which informs prevention efforts.","startTime":86.629,"finishTime":88.349},{"text":"Examples of items audited by compliance include timely consumer visits,","startTime":89.15,"finishTime":93.22},{"text":"annual signatures on waiver consent forms,","startTime":93.43,"finishTime":95.779},{"text":"consistency between waiver service plans and case notes,","startTime":96.029,"finishTime":99.099},{"text":"and timely documentation of significant events and incident reports.","startTime":99.23,"finishTime":102.87},{"text":"When an audit identifies a problem,","startTime":103.69,"finishTime":105.36},{"text":"the responsible division determines the root cause","startTime":105.62,"finishTime":107.98},{"text":"and develops correction and prevention plans.","startTime":107.98,"finishTime":110.3},{"text":"Everyone at Direction Home plays a role in keeping our agency compliant.","startTime":111.069,"finishTime":114.75}]}},"assets":["y34xcvdoWZph5gx36","GStKJSvGG9Jus24Wb"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Monitoring and auditing require ongoing review of regulations and contracts to identify the requirements and metrics that must be audited. Contracts can change regularly. If we do not keep up with those changes, we may miss important compliance requirements. We must continually review applicable regulations and signed contracts, then communicate relevant changes so employees understand what they are expected to do.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-MichelleNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"As noted earlier, we conduct audits of each program. We audit agency operations except for Ombudsman, HR, IT, and Fiscal. Those divisions self-monitor by conducting their own audits and reporting the findings to Compliance. Audit results must lead to action. We communicate results to divisions by email, during monthly team meetings, and at quarterly Compliance Committee meetings. We also communicate findings to individual employees and their supervisors so that non-compliance can be corrected promptly. If you receive an email about an audit finding, you are expected to correct it. Our goal is to identify non-compliance or omissions, correct them promptly, and prevent them from recurring. Internal audits are designed to help us improve; they are not punitive or intended for external use. Aggregate audit scores—not employee-specific findings—are reported to the Compliance Committee and the Board.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-MichelleNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The auditing process helps us identify trends and patterns, which informs prevention efforts. Examples of items audited by Compliance include timely consumer visits, annual signatures on Waiver Consent forms, consistency between waiver service plans and case notes, and timely documentation of significant events and incident reports. When an audit identifies a problem, the responsible division determines the root cause and develops correction and prevention plans. Everyone at Direction Home plays a role in keeping our agency compliant.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-MichelleNeural\",\"rate\":1}},{\"children\":[],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-MichelleNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","voiceCodeUsed":"en-US-MichelleNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"promptText":"Monitoring and auditing require ongoing review of regulations and contracts to identify the requirements and metrics that must be audited. Contracts can change regularly. If we do not keep up with those changes, we may miss important compliance requirements. We must continually review applicable regulations and signed contracts, then communicate relevant changes so employees understand what they are expected to do.\nAs noted earlier, we conduct audits of each program. We audit agency operations except for Ombudsman, HR, IT, and Fiscal. Those divisions self-monitor by conducting their own audits and reporting the findings to Compliance. Audit results must lead to action. We communicate results to divisions by email, during monthly team meetings, and at quarterly Compliance Committee meetings. We also communicate findings to individual employees and their supervisors so that non-compliance can be corrected promptly. If you receive an email about an audit finding, you are expected to correct it. Our goal is to identify non-compliance or omissions, correct them promptly, and prevent them from recurring. Internal audits are designed to help us improve; they are not punitive or intended for external use. Aggregate audit scores—not employee-specific findings—are reported to the Compliance Committee and the Board.\nThe auditing process helps us identify trends and patterns, which informs prevention efforts. Examples of items audited by Compliance include timely consumer visits, annual signatures on Waiver Consent forms, consistency between waiver service plans and case notes, and timely documentation of significant events and incident reports. When an audit identifies a problem, the responsible division determines the root cause and develops correction and prevention plans. Everyone at Direction Home plays a role in keeping our agency compliant.\n","jobId":"wbRKd6yrZv2bQJKaE"}},"zfvcLtRwdbKbg69wF":{"_id":"zfvcLtRwdbKbg69wF","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"locale":"en","template":"resourceSlide","title":"Untitled","upload":"J7TDjRuK238y892cS"},"dates":{"dateCreated":"2026-10-23T13:30:00.169Z","dateModified":"2026-10-23T19:12:25.751Z"},"users":{"_userCreatorID":"P8bj8BqgzCgCGZYmC","_userModifierID":"P8bj8BqgzCgCGZYmC"},"video":{"autoPlay":true,"overlays":[{"identifier":"RbFNSeX3F6zTT552N","kind":"o
