10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-TonyNeural\">If more than six hundred dollars is left over, or if receipts are not submitted, the funds may be treated as taxable income and a 1099 form may be issued. To help avoid a 1099 form, do not authorize more self-directed goods and services than will be used for each purchase, send authorizations with requested start and end dates, and complete purchases and provide receipts within 30 days.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"If more than $600 is left over or if receipts are not submitted,","startTime":0.009,"finishTime":4.36},{"text":"the funds may be treated as taxable income and a 10099 form may be issued.","startTime":4.57,"finishTime":9.21},{"text":"To help avoid a 1099 form,","startTime":10.039,"finishTime":12.09},{"text":"do not authorize more self-directed goods and services","startTime":12.329,"finishTime":15.409},{"text":"than will be used for each purchase.","startTime":15.409,"finishTime":17.049},{"text":"Send authorization with requested start and end dates,","startTime":17.25,"finishTime":20.54},{"text":"and complete purchases and provide receipts within 30 days.","startTime":20.569,"finishTime":24.25}]}},"DnmeRJek8RAzvNdtP":{"_id":"DnmeRJek8RAzvNdtP","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":1370880,"uploadedFileName":"Tony-en-Conclusion-152026.mp3","uploadedFileNameExtension":".mp3","duration":57.0875},"dates":{"dateCreated":"2026-01-06T01:55:08.993Z","dateModified":"2026-01-06T01:55:15.994Z"},"users":{"_userCreatorID":"P8bj8BqgzCgCGZYmC","_userModifierID":"P8bj8BqgzCgCGZYmC"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq 500 per 365 days","startTime":68.569,"finishTime":74.389},{"text":"for items not covered by Medicaid or other sources.","startTime":74.389,"finishTime":77.29},{"text":"Service hours per week are the authorized hours per service.","startTime":78.209,"finishTime":81.43},{"text":"State unemployment insurance is a required employer cost.","startTime":82.489,"finishTime":85.51},{"text":"Total budget allocated summarizes weekly allocations by service.","startTime":86.519,"finishTime":90.449},{"text":"Total hourly rate,","startTime":91.29,"finishTime":92.379},{"text":"including employer expenses,","startTime":92.58,"finishTime":93.98},{"text":"reflects the caregiver's wage plus employer-related costs.","startTime":94.26,"finishTime":97.339},{"text":"Weekly base units and weekly quarter-hour units","startTime":99.61,"finishTime":102.25},{"text":"are authorized counts that apply to home","startTime":102.25,"finishTime":104.33},{"text":"care attendant nursing and waiver nursing for","startTime":104.33,"finishTime":106.529},{"text":"non-agency licensed professional and registered nurses.","startTime":106.529,"finishTime":109.48},{"text":"They do not apply to Choice's home care attendant or personal care aide.","startTime":109.72,"finishTime":113.37},{"text":"Weekly budget allocated by service combine's hours,","startTime":114.18,"finishTime":117.379},{"text":"wage,","startTime":117.51,"finishTime":118.059},{"text":"and employer-related expenses.","startTime":118.22,"finishTime":119.94},{"text":"Weekly service hours apply to Choice's home care attendant and personal care aide.","startTime":120.889,"finishTime":125.23}]}},"workspaceId":"oPYJFRcZXq3TGjd6g","assets":["Z9p5oQFhQ7nsjqrp8","jHMbvNvFaF69zLZCs","mv3thJXcAjL3XJAqQ","p3NCYFiyirx9ABiHs","ftBzvxgKNdCNvooZW"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":[],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Key terms establish how the budget worksheet functions within self‑direction. Care manager inputs are entries drawn from the person‑centered service plan that drive automatic calculations. Employer‑related expenses include payroll taxes, workers’ compensation, background checks, and processing fees. Home maintenance and chore supports heavy cleaning, minor repairs, and similar tasks, limited to $10,000 per year. Home modifications are physical changes that improve safety and accessibility, also limited to $10,000 per year. Hourly wage rate is the agreed caregiver wage, at least Ohio’s minimum wage.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-TonyNeural\",\"rate\":1}},{\"children\":[{\"type\":\"textToSpeechBreak\",\"version\":1,\"duration\":0.5}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-TonyNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Maximum weekly budget available reflects the highest amount based on plan authorizations and Ohio Administrative Code rates. Remaining weekly budget available shows unallocated funds. Remaining maximum possible hourly wage rate indicates the highest feasible wage after hours and employer‑related expenses are considered; values update automatically and serve as a reference.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-TonyNeural\",\"rate\":1}},{\"children\":[{\"type\":\"textToSpeechBreak\",\"version\":1,\"duration\":0.5}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-TonyNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\": ish how the budget worksheet functions within self‑direction. Care manager inputs are entries drawn from the person‑centered service plan that drive automatic calculations. Employer‑related expenses include payroll taxes, workers’ compensation, background checks, and processing fees. Home maintenance and chore supports heavy cleaning, minor repairs, and similar tasks, limited to $10,000 per year. Home modifications are physical changes that improve safety and accessibility, also limited to $10,000 per year. Hourly wage rate is the agreed caregiver wage, at least Ohio’s minimum wage.\n\nMaximum weekly budget available reflects the highest amount based on plan authorizations and Ohio Administrative Code rates. Remaining weekly budget available shows unallocated funds. Remaining maximum possible hourly wage rate indicates the highest feasible wage after hours and employer‑related expenses are considered; values update automatically and serve as a reference.\n\nSelf‑directed goods and services provide $2,500 per 365 days for items not covered by Medicaid or other sources. Service hours per week are the authorized hours per service. State unemployment insurance is a required employer cost. Total budget allocated summarizes weekly allocations by service. Total hourly rate including employer expenses reflects the caregiver’s wage plus employer‑related costs.\n\nWeekly base units and weekly quarter‑hour units are authorized counts that apply to home care attendant nursing and waiver nursing for non‑agency licensed professional and registered nurses; they do not apply to choices home care attendant or personal care aide. Weekly budget allocated by service combines hours, wage, and employer‑related expenses. Weekly service hours apply to choices home care attendant and personal care aide.\n\n","featureAdoption":{"isAddingPauses":true,"isUsingMultipleVoices":false,"isAdjustingSpeed":false},"voiceCodeUsed":"en-US-TonyNeural","jobId":"JK49Q8duxR3DmNq6o"}},"2Qi6xz3a4DJT6gq88":{"_
