A)\u003c/strong> may include skilled nursing services, but their roles differ significantly.\u003c/div>\n\n\u003cul>\n\t\u003cli>\u003cstrong>Waiver Nursing\u003c/strong> is delivered by licensed nurses and includes the full scope of skilled nursing within their professional license.\u003c/li>\n\t\u003cli>\u003cstrong>Home Care Attendants may perform only specific, authorized skilled nursing tasks\u003c/strong>, and only when:\n\t\u003cul>\n\t\t\u003cli>Approved by a \u003cstrong>licensed RN or physician\u003c/strong>, and\u003c/li>\n\t\t\u003cli>Completed under \u003cstrong>RN direction and within defined program limits\u003c/strong>\u003c/li>\n\t\u003c/ul>\n\t\u003c/li>\n\t\u003cli>\u003cstrong>Home Care Attendants cannot perform all skilled nursing tasks\u003c/strong> and are not licensed nurses.\u003c/li>\n\t\u003cli>\u003cstrong>Personal Care Aides and Choices Home Care Attendants do not provide skilled nursing services.\u003c/strong>\u003c/li>\n\u003c/ul>\n\n\u003cdiv>It is important to recognize that while HCAs may assist with certain skilled tasks, \u003cstrong>those tasks are limited, delegated, and closely supervised\u003c/strong>.\u003c/div>\n\u003c/div>\n","feedbackNegative":"\u003cdiv>\n\u003cdiv>\u003cstrong>Incorrect.\u003c/strong>\u003cbr />\nBoth \u003cstrong>Waiver Nursing\u003c/strong> and \u003cstrong>Home Care Attendants (HCA)\u003c/strong> may include skilled nursing services, but their roles differ significantly.\u003c/div>\n\n\u003cul>\n\t\u003cli>\u003cstrong>Waiver Nursing\u003c/strong> is delivered by licensed nurses and includes the full scope of skilled nursing within their professional license.\u003c/li>\n\t\u003cli>\u003cstrong>Home Care Attendants may perform only specific, authorized skilled nursing tasks\u003c/strong>, and only when:\n\t\u003cul>\n\t\t\u003cli>Approved by a \u003cstrong>licensed RN or physician\u003c/strong>, and\u003c/li>\n\t\t\u003cli>Completed under \u003cstrong>RN direction and within defined program limits\u003c/strong>\u003c/li>\n\t\u003c/ul>\n\t\u003c/li>\n\t\u003cli>\u003cstrong>Home Care Attendants cannot perform all skilled nursing tasks\u003c/strong> and are not licensed nurses.\u003c/li>\n\t\u003cli>\u003cstrong>Personal Care Aides and Choices Home Care Attendants do not provide skilled nursing services.\u003c/strong>\u003c/li>\n\u003c/ul>\n\n\u003cdiv>It is important to recognize that while HCAs may assist with certain skilled tasks, \u003cstrong>those tasks are limited, delegated, and closely supervised\u003c/strong>.\u003c/div>\n\u003c/div>\n"}},"responses":[{"description":{"html":"\u003cdiv>Waiver Nursing\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"2Hr7S6o6LmhpvsJm7"},{"description":{"html":"\u003cdiv>Personal Care Aide\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"xTT27DpJFYJCghudZ"},{"description":{"html":"\u003cdiv>Choices Home Care Attendant\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"3W5abKff2i3vhs6Pb"},{"description":{"html":"\u003cdiv>Home Care Attendant\u003c/div>\n","type":"text","resourceWidthPercentage":100},"identifier":"4KzxNs39Px5kMuJE9"},{"identifier":"YM8AbbNe3qrcFF5xv","description":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>All of the above\u003c/div>\n"}}],"assets":[],"overlayTemplateIds":[],"fontFamilies":[],"childResources":[]},"5rFKYMJ7QYrAtS2Ar":{"_id":"5rFKYMJ7QYrAtS2Ar","_siteID":"ZoiyEJNGnnXpx9Jbx","workspaceId":"oPYJFRcZXq3TGjd6g","data":{"attributes":{"locale":"en","template":"questionFreeText","title":{"type":"text","resourceWidthPercentage":100,"html":"\u003cdiv>\n\u003col>\n\t\u003cli>What self-direction options are available to Jacob?\u003c/li>\n\t\u003cli>What are some important considerations as he identifies the services that are right for him?\u003c/li>\n\u003c/ol>\n\u003c/div>\n"}},"options":{"retryUntilSuccess":true,"score":0},"submitButton":{"containerOverlay":{"identifier":"2T3Ek7WYdY3GrEasY","kind":"overlay","type":"b
