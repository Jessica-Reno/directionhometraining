eech","textToSpeechData":{"prompt":"The U.S. Stark Law, which focuses on physician self-referrals, is related to anti-kickback statutes. Both are intended to prevent healthcare providers from inappropriately profiting from referrals. The Stark Law generally prohibits a physician from referring Medicare patients for designated health services to an entity with which the physician or an immediate family member has a financial relationship, unless an exception applies.\nThe law also limits billing for prohibited referrals. Consequences can include payment denial, refunds, and other sanctions like civil penalties, and exclusion from government healthcare programs.\nAsk Compliance to review potential referral conflicts. Stark and anti-kickback requirements are separate.\n","voiceCode":"en-US-AlloyTurboMultilingualNeural","language":"en","originalResourceId":"RGMo2eAxe6vRapHhr","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-AlloyTurboMultilingualNeural\">The U.S. Stark Law, which focuses on physician self-referrals, is related to anti-kickback statutes. Both are intended to prevent healthcare providers from inappropriately profiting from referrals. The Stark Law generally prohibits a physician from referring Medicare patients for designated health services to an entity with which the physician or an immediate family member has a financial relationship, unless an exception applies.\u003cbreak time=\"0.5s\"/>The law also limits billing for prohibited referrals. Consequences can include payment denial, refunds, and other sanctions like civil penalties, and exclusion from government healthcare programs.\u003cbreak time=\"0.5s\"/>Ask Compliance to review potential referral conflicts. Stark and anti-kickback requireme , and reckless disregard of whether information is true or false.\nNo specific intent to defraud is required. An error alone does not automatically establish a violation.\nOrganizations need to keep accurate records and report concerns promptly. \nThe U.S. False Claims Act protects reporters from retaliation, including harassment, demotion, and wrongful termination.\n","voiceCode":"en-US-AlloyTurboMultilingualNeural","language":"en","originalResourceId":"v4wRKikHuAdjtP7Xh","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-AlloyTurboMultilingualNeural\">The U.S. False Claims Act prohibits knowingly submitting or causing false claims for government payment, and false records or statements material to a false claim.\u003cbreak time=\"0.5s\"/>“Knowingly” includes actual knowledge, deliberate ignorance, and reckless disregard of whether information is true or false.\u003cbreak time=\"0.5s\"/>No specific intent to defraud is required. An error alone does not automatically establish a violation.\u003cbreak time=\"0.5s\"/>Organizations need to keep accurate records and report concerns promptly. \u003cbreak time=\"0.5s\"/>The U.S. False Claims Act protects reporters from retaliation, including harassment, demotion, and wrongful termination.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"The US False Claims Act prohibits knowingly","startTime":0.1,"finishTime":2.609},{"text":"submitting or causing false claims for government payment","startTime":2.609,"finishTime":5.63},{"text":"and false records or statements material to a false claim.","startTime":5.849,"finishTime":9.069},{"text":"Knowingly includes actual knowledge,","startTime":9.96,"finishTime":12.069},{"text":"deliberate ignorance,","startTime":12.239,"finishTime":13.159},{"text":"and reckless disregard of whether information is true or false.","startTime":13.239,"finishTime":16.62},{"text":"No specific intent to defraud is required.","startTime":17.59,"finishTime":20.079},{"text":"An error alone does not automatically establish a violation.","startTime":20.399,"finishTime":23.76},{"text":"Organizations need to keep accurate records and report concerns promptly.","startTime":24.62,"finishTime":28.629},{"text":"The US False Claims Act protects reporters from retaliation,","startTime":29.399,"finishTime":33},{"text":"including harassment,","startTime":33.439,"finishTime":34.319},{"text":"demotion,","startTime":34.43,"finishTime":35.049},{"text":"and wrongful termination.","startTime":35.11,"finishTime":36.34}]}},"tncFBXA342jEcNw3r":{"_id":"tncFBXA342jEcNw3r","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":599040,"uploadedFileName":"Alloy-en-HIPAA-10262026.mp3","uploadedFileNameExtension":".mp3","duration":24.9125},"dates":{"dateCreated":"2026-10-26T16:03:16.781Z","dateModified":"2026-10-26T16:03:20.363Z"},"users":{"_userCreatorID":"P8bj8BqgzCgCGZYmC","_userModifierID":"P8bj8BqgzCgCGZYmC"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"The Health Insurance Portability and Accountability Act of 1996, most commonly referred to as HIPAA, addresses patient privacy and includes fraud and abuse enforcement provisions.\nHIPAA established the Health Care Fraud and Abuse Control program to coordinate enforcement efforts.\nHIPAA also created a federal health care fraud offense covering private and government health care benefit programs.\n","voiceCode":"en-US-AlloyTurboMultilingualNeural","language":"en","originalResourceId":"9knRt7zcFc68bh6b3","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-AlloyTurboMultilingualNeural\">The Health Insurance Portability and Accountability Act of 1996, most commonly referred to as HIPAA, addresses patient privacy and includes fraud and abuse enforcement provisions.\u003cbreak time=\"0.5s\"/>HIPAA established the Health Care Fraud and Abuse Control program to coordinate enforcement efforts.\u003cbreak time=\"0.5s\"/>HIPAA also created a federal health care fraud offense covering private and government health care benefit programs.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"The Health Insurance Portability and Accountability Act of 1996,","startTime":0.009,"finishTime":4.239},{"text":"most commonly referred to as HIPAA,","startTime":4.57,"finishTime":6.53},{"text":"addresses patient privacy","startTime":6.889,"finishTime":8.34},{"text":"and includes fraud and abuse enforcement provisions.","startTime":8.568999999999999,"finishTime":11.329},{"text":"HIPAA established the Healthcare fraud and abuse Control Program","startTime":12.239,"finishTime":15.5},{"text":"to coordinate enforcement efforts.","startTime":15.92,"finishTime":17.68},{"text":"HIPAA also created a federal healthcare fraud offense","startTime":18.569,"finishTime":21.569},{"text":"covering private and government healthcare benefit programs.","startTime":21.569,"finishTime":24.629}]}},"wS3iw87u6fmXQgxZz":{"_id":"wS3iw87u6fmXQgxZz","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":720576,"uploadedFileName":"Alloy-en-EmployeeFraudandAbuseKeyIndicators-10262026.mp3","uploadedFileNameExtension":".mp3","duration":29.9875},"dates":{"dateCreated":"2026-10-26T15:59:23.612Z","dateModified":"2026-10-26T15:59:27.043Z"},"users":{"_userCreatorID":"P8bj8BqgzCgCGZYmC","_userModifierID":"P8bj8BqgzCgCGZYmC"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"Employee fraud and abuse key indicators can include falsification of patient records by an employee, essentially recording untrue information in a patient record. Please note if the patients that had their records falsified were being served through a government program, billing for services related to these documented visits could violate the U.S. False Claims Act. \nAlso, identity theft, or using a member's ID number to obtain prescriptions, services, supplies, etc. are examples of fraud and abuse.\n","voiceCode":"en-US-AlloyTurboMultilingualNeural","language":"en","originalResourceId":"wkJvYw9k3TMPoeyT9","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-AlloyTurboMultilingualNeural\">Employee fraud and abuse key indicators can include falsification of patient records by an employee, essentially recording untrue information in a patient record. Please note if the patients that had their records falsified were being served through a government program, billing for services related to these documented visits could violate the U.S. False Claims Act. \u003cbreak time=\"0.5s\"/>Also, identity theft, or using a member's ID number to obtain prescriptions, services, supplies, etc. are examples of fraud and abuse.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"Employee fraud and abuse key indicators can include","startTime":0.009,"finishTime":3.009},{"text":"falsification of patient records by an employee,","startTime":3.009,"finishTime":5.8},{"text":"essentially recording untrue information in a patient record.","startTime":6.25,"finishTime":9.59},{"text":"Please note if the patients that had their records","startTime":9.93,"finishTime":11.93},{"text":"falsified were being served through a government program.","startTime":11.93,"finishTime":14.75},{"text":"Billing for services related to these documented visits","startTime":15.079,"finishTime":17.889},{"text":"could violate the US False Claims Act.","startTime":17.889,"finishTime":20.17},{"text":"Also,","startTime":21.139,"finishTime":21.579},{"text":"identity theft,","startTime":21.69,"finishTime":22.77},{"text":"or using a member's ID number to obtain prescriptions,","startTime":23.02,"finishTime":25.85},{"text":"services,","startTime":26.139,"finishTime":26.61},{"text":"supplies,","startTime":26.69,"finishTime":27.26},{"text":"etc.","startTime":27.34,"finishTime":27.739},{"text":"are examples of fraud and abuse.","startTime":27.899,"finishTime":29.52}]}},"wakLh5J9aFzbbpjfD":{"_id":"wakLh5J9aFzbbpjfD","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":516096,"uploadedFileName":"Alloy-en-USFederalHealthCareFraudStatute-10262026.mp3","uploadedFileNameExtension":".mp3","duration":21.4625},"dates":{"dateCreated":"2026-10-26T16:02:36.874Z","dateModified":"2026-10-26T16:02:40.414Z"},"users":{"_userCreatorID":"P8bj8BqgzCgCGZYmC","_userModifierID":"P8bj8BqgzCgCGZYmC"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"The U.S. federal health care fraud statute applies to private and government health care benefit programs. It prohibits knowingly and willfully executing or attempting a fraudulent scheme against a health care benefit program. A person need not know the statute itself or specifically intend to violate that statute. Violations can result in criminal fines and imprisonm
