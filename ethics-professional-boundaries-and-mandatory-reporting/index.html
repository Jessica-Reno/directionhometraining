ess exists so that concerns","startTime":33.47,"finishTime":36.069},{"text":"can be reviewed by the appropriate authorities.","startTime":36.069,"finishTime":38.33},{"text":"Waiting for proof may delay necessary intervention","startTime":39.2,"finishTime":41.919},{"text":"and increase risk for the individual involved.","startTime":42.04,"finishTime":44.5}]}},"assets":["2gXC7RNCKGSAv877g","SyjSsDzE5JLNHgxQL"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":["fidDDeTM9CK4AgjsEHMz","45hKJtBKsyiCkZh4p"],"voiceOver":{"jobId":"8sDEC8542rSRxcd6c","voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Certain professions are identified under Ohio law as mandatory reporters. These individuals have legal responsibilities to report suspected harm involving vulnerable adults.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-ClaraNeural\",\"rate\":1}},{\"children\":[],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-ClaraNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"In addition to legal requirements, Direction Home has organizational expectations that apply to employees who become aware of concerns involving abuse, neglect, threats of serious harm, animal welfare concerns, and other safety or compliance issues.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-ClaraNeural\",\"rate\":1}},{\"children\":[],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-ClaraNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"st :"rgba(255, 255, 255, 1)"}},{"identifier":"Y2zDSDXMH39vycP6h","kind":"overlay","htmlContent":"\u003cul>\u003cli>\n\u003cspan style=\"color:rgba(255, 255, 255, 1)\">Provide information about identified risks and available options.\u003c/span>\u003c/li>\n\u003cli>\n\u003cspan style=\"color:rgba(255, 255, 255, 1)\">Respect informed choices when legally and programmatically permissible.\u003c/span>\u003c/li>\n\u003cli>\n\u003cspan style=\"color:rgba(255, 255, 255, 1)\">Document concerns, choices, and actions.\u003c/span>\u003c/li>\n\u003cli>\n\u003cspan style=\"color:rgba(255, 255, 255, 1)\">Follow reporting and escalation requirements.\u003c/span>\u003c/li>\n\u003cli>\n\u003cspan style=\"color:rgba(255, 255, 255, 1)\">Consult when safety, capacity, or professional judgment questions arise.\u003c/span>\u003c/li>\u003c/ul>\n","height":163,"width":785,"y":454,"x":407,"flipHorizontal":false,"flipVertical":false,"type":"svgShape","svgShape":"rect","start":0,"behaviorType":"continue","rotationAngle":0,"entranceAnimation":{"type":"fadeIn","duration":500},"exitAnimation":{"type":"fadeOut","duration":500},"customStyle":{"type":"rectangle","lineHeight":1.596000051498413,"textAlignment":"left","verticalAlignment":"top","font":{"size":12.380952835083008,"bold":false,"italic":false,"underline":false,"family":"fidDDeTM9CK4AgjsEHMz"},"roundedCorners":{"topLeft":0,"topRight":0,"bottomLeft":0,"bottomRight":0},"border":{"color":"koantic(accent1, 5, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"fill":{"type":"color","color":"transparent"},"padding":{"bottom":0,"top":0.9161905097961434,"left":0,"right":0},"fontColor":"rgba(255, 255, 255, 1)"}}],"background":{"backgroundColor":"rgba(255, 255, 255, 1)","backgroundImageOpacity":100},"duration":51.1625,"captions":[{"text":"One of the most challenging ethical situations occurs when","startTime":0.17,"finishTime":3.13},{"text":"personal choice and safety concerns appear to conflict.","startTime":3.13,"finishTime":6.21},{"text":"An individual may choose to decline services,","startTime":7.51,"finishTime":10.069},{"text":"accept certain risks,","startTime":10.39,"finishTime":11.39},{"text":"or make decisions that others would not make.","startTime":11.55,"finishTime":13.77},{"text":"Respect for autonomy requires acknowledging an individual's right to","startTime":14.609,"finishTime":18.09},{"text":"make informed decisions when legally and programmatically permissible.","startTime":18.09,"finishTime":21.59},{"text":"At the same time,","startTime":22.92,"finishTime":23.879},{"text":"safety concerns,","startTime":24.12,"finishTime":25.12},{"text":"reporting obligations,","startTime":25.399,"finishTime":26.51},{"text":"consultation requirements,","startTime":26.719,"finishTime":28.03},{"text":"and documentation expectations may still apply.","startTime":28.159,"finishTime":30.92},{"text":"The goal is not to eliminate choice,","startTime":31.719,"finishTime":33.54},{"text":"but to balance respect for individual preferences with","startTime":33.919,"finishTime":36.639},{"text":"professional responsibilities intended to protect health and welfare.","startTime":36.639,"finishTime":40.119},{"text":"When uncertainty exists regarding safety,","startTime":41.56,"finishTime":43.81},{"text":"capacity,","startTime":43.97,"finishTime":44.68},{"text":"or appropriate action,","startTime":44.889,"finishTime":46.08},{"text":"consultation and review of applicable requirements are important next steps.","startTime":46.33,"finishTime":50.33}]}},"assets":["5AP2zBwfGvigJrGfw","TPjAfu3zrrtd2DXzS"],"childResources":[],"overlayTemplateIds":[],"fontFamilies":["fidDDeTM9CK4AgjsEHMz","45hKJtBKsyiCkZh4p"],"voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"One of the most challenging ethical situations occurs when personal choice and safety concerns appear to conflict.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\" \":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"This scenario illustrates a common challenge in service coordination. The requests being made may appear reasonable and are often motivated by legitimate needs. However, the appropriate response is not determined solely by whether assistance would be helpful. It is determined by professional boundaries, role expectations, organizational requirements, and the need to maintain objective professional relationships.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-CA-ClaraNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"Consider this scenario.\n\nAs a Waiver Service Coordinator, a member asks for assistance with several requests. The member asks to be taken to an appointment, asks for groceries to be picked up, and offers a $25 gift card as a gesture of appreciation.\n\nWhat ethical concerns might be present in this situation? Which requests create potential professional boundary concerns? What steps should be taken before responding?\n\nThis scenario illustrates a common challenge in service coordination. The requests being made may appear reasonable and are often motivated by legitimate needs. However, the appropriate response is not determined solely by whether assistance would be helpful. It is determined by professional boundaries, role expectations, organizational requirements, and the need to maintain objective professional relationships.","voiceCodeUsed":"en-CA-ClaraNeural","featureAdoption":{"isUsingMultipleVoices":false,"isAddingPauses":false,"isAdjustingSpeed":false},"jobId":"ZGdFgQHyZtdBzsWHy"}},"kRgTD4wcWcJ8e7EEL":{"_id":"kRgTD4wcWcJ8e7EEL","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"locale":"en","template":"resourceSlide","title":"Slide 8","upload":"BggkA5Co8yQseLjgZ"},"dat
