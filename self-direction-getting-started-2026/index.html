al care, home care, and community access. They may replace comparable home health services because of differences in service methodology. Self-directed services can be provided by a parent, spouse, or family member in accordance with Ohio Administrative Code 51 60 44 32. Personal care aides in self-direction may enroll through the F M S, be approved through the O D M as a non-agency provider, or be certified through the Ohio Department of Aging as a consumer-directed personal care services provider. Self-directed caregivers cannot work for an agency because they are employed directly by the individual.","voiceCode":"en-US-OnyxTurboMultilingualNeural","language":"en","originalResourceId":"TZhuv6JWkvhoXxv6B","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-OnyxTurboMultilingualNeural\">Home health aide services under the state plan are typically part-time and intermittent, limited to four hours per visit and no more than eight hours per day. These services are provided only by Ohio Department of Medicaid-enrolled Medicare-certified home health agencies and generally cannot include transportation. In comparison, aide services available through self-direction under the waiver can be intermittent or continuous. These services include assistance with personal care, home care, and community access. They may replace comparable home health services because of differences in service methodology. Self-directed services can be provided by a parent, spouse, or family member in accordance with Ohio Administrative Code 51 60 44 32. Personal care aides in self-direction may enroll through the F M S, be approved through the O D M as a non-agency provider, or be certified through the Ohio Department of Aging as a consumer-directed personal care services provider. Self-directed caregivers cannot work for an agency because they are employed directly by the individual.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"Home health aid services under the state","startTime":0.129,"finishTime":2.039},{"text":"plan are typically part-time and intermittent,","startTime":2.039,"finishTime":4.199},{"text":"limited to 4 hours per visit,","startTime":4.61,"finishTime":6.28},{"text":"and no more than 8 hours per day.","startTime":6.369,"finishTime":8.3},{"text":"These services are provided only by Ohio Department","startTime":8.609,"finishTime":11.21},{"text":"of Medicaid enrolled Medicare certified home health agencies","startTime":11.21,"finishTime":14.659},{"text":"and generally cannot include transportation.","startTime":15.01,"finishTime":17.649},{"text":"In comparison,","startTime":17.889,"finishTime":18.85},{"text":"aid services available through self-direction under the","startTime":19.139,"finishTime":21.61},{"text":"waiver can be intermittent or continuous.","startTime":21.61,"finishTime":24.19},{"text":"These services include assistance with personal care,","startTime":24.569,"finishTime":27.159},{"text":"home care,","startTime":27.37,"finishTime":28.049},{"text":"and community access.","startTime":28.239,"finishTime":29.409},{"text":"They may replace comparable home health services","startTime":29.909,"finishTime":32.63},{"text":"because of differences in service methodology.","startTime":32.63,"finishTime":35.009},{"text":"Self-directed services can be provided by a parent,","startTime":35.389,"finishTime":38.029},{"text":"spouse,","startTime":38.189,"finishTime":38.9},{"text":"or family member in accordance with Ohio administrative code","startTime":39.15,"finishTime":42.33},{"text":"51604432.","startTime":42.75,"finishTime":45.15},{"text":"Personal care aides and self-direction may enroll through the FMS,","startTime":45.509,"finishTime":48. partment of Aging.","voiceCode":"en-US-OnyxTurboMultilingualNeural","language":"en","originalResourceId":"EWgKFzGvx5Z85eAXw","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-OnyxTurboMultilingualNeural\">Personal care aide services under the waiver provide intermittent and continuous support. These services include personal care, home care, errands, and community access. They can also assist with money management. Choices home care attendants must be certified by the Ohio Department of Aging. Both service types differ in methodology from agency-based services and are designed to offer flexibility for individuals who self-direct. Personal care aides may be approved through the Ohio Department of Medicaid, the Financial Management Service, or certified through the Ohio Department of Aging.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"Personal care aid services under the","startTime":0.129,"finishTime":2.049},{"text":"waiver provide intermittent and continuous support.","startTime":2.049,"finishTime":5.07},{"text":"These services include personal care,","startTime":5.329,"finishTime":7.25},{"text":"home care,","startTime":7.449,"finishTime":8.109},{"text":"errands,","startTime":8.239,"finishTime":8.689},{"text":"and community access.","startTime":8.729,"finishTime":10.029},{"text":"They can also assist with money management.","startTime":10.369,"finishTime":12.39},{"text":"Choice's home care attendance must be certified by the Ohio Department of Aging.","startTime":12.76,"finishTime":17.09},{"text":"Both service types differ in methodology from agency-based services","startTime":17.37,"finishTime":21.19},{"text":"and are designed to offer flexibility for individuals who self-direct.","startTime":21.45,"finishTime":24.819},{"text":"Personal care aids may be approved through the Ohio Department of Medicaid.","startTime":25.45,"finishTime":29.049},{"text":"The Financial Management Service","startTime":29.409,"finishTime":31.19},{"text":"or certified through the Ohio Department of Aging.","startTime":31.37,"finishTime":33.889}]}},"repCtzEnFZJfkp2Pc":{"_id":"repCtzEnFZJfkp2Pc","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":450432,"uploadedFileName":"Onyx-en-Self-DirectedWaiverNurse-152026.mp3","uploadedFileNameExtension":".mp3","duration":18.7375},"dates":{"dateCreated":"2026-01-05T19:28:57.103Z","dateModified":"2026-01-05T19:28:59.404Z"},"users":{"_userCreatorID":"P8bj8BqgzCgCGZYmC","_userModifierID":"P8bj8BqgzCgCGZYmC"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"Eligibility for waiver nurses requires enrollment with the Ohio Department of Medicaid as a waiver nurse or meeting criteria outlined in Ohio Administrative Code 5160-44-22. Waiver nurses must hold a current, unrestricted nursing license to provide services under self-direction.","voiceCode":"en-US-OnyxTurboMultilingualNeural","language":"en","originalResourceId":"zpYwePXgrNrNxWtC3","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-OnyxTurboMultilingualNeural\">Eligibility for waiver nurses requires enrollment with the Ohio Department of Medicaid as a waiver nurse or meeting criteria outlined in Ohio Administrative Code 5160-44-22. Waiver nurses must hold a current, unrestricted nursing license to provide services under self-direction.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"Eligibility for waiver nurses requires enrollment","startTime":0.009,"finishTime":3.009},{"text":"with the Ohio Department of Medicaid","startTime":3.009,"finishTime":4.65},{"text":"as a waiver nurse or meeting criteria outlined in Ohio administrative code","startTime":4.65,"finishTime":8.949},{"text":"5160-44-22.","startTime":9.199,"finishTime":12.369},{"text":"Waiver nurses must hold a current unrestricted","startTime":12.689,"finishTime":15.199},{"text":"nursing license to provide services under self-direction.","startTime":15.199,"finishTime":18.37}]}},"ruNraLAry4cjNMrYk":{"_id":"ruNraLAry4cjNMrYk","_siteID":"ZoiyEJNGnnXpx9Jbx","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":1654848,"uploadedFileName":"Onyx-en-Conclusion-152026.mp3","uploadedFileNameExtension":".mp3","duration":68.9125},"dates":{"dateCreated":"2026-01-05T20:05:59.473Z","dateModified":"2026-01-05T20:06:08.656Z"},"users":{"_userCreatorID":"P8bj8BqgzCgCGZYmC","_userModifierID":"P8bj8BqgzCgCGZYmC"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"oPYJFRcZXq3TGjd6g","source":"textToSpeech","textToSpeechData":{"prompt":"This concludes the Getting Started with Self‑Direction training. The lesson outlined how individuals choose self‑directed services, described methods for identifying and recruiting caregivers, and detailed the Employer and Employee Agreement that governs roles, expectations, and documentation. It distinguished aide and nursing service options across state plan and waiver services, clarified differences in service methodology, and explained pathways for caregiver eligibility and enrollment through the Ohio Department of Medicaid, the Financial Management Service, and the Ohio Department of Aging. Practical scenarios illustrated how these elements are applied to real‑world circumstances.\nBy understanding service options, caregiver recruitment, eligibility pathways, and agreement requirements, waiver service coordinators can support individuals in achieving greater choice, control, and flexibility through self‑direction. For additional information or questions, waiver service coordinators may reference the Service Sorting Chart, the Service Sorting Process Flow, and the Employer and Employee Agreement, or contact the Self‑Direction support team at the Ohio Department of Medicaid.","voiceCode":"en-US-OnyxTurboMultilingualNeural","language":"en","originalResourceId":"tEoAERpSuxBr7cmbs","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-OnyxTurboMultilingualNeural\">This concludes the Getting Started with Self‑Direction training. The lesson outlined how individuals choose self‑directed services, described methods for identifying and recruiting caregivers, and detailed the Employer and Employee Agreement that governs roles, expectations, and documentation. It distinguished aide and nursing service options across state plan and waiver services, clarified differences in service methodology, and explained pathways for caregiver eligibility and enrollment through the Ohio Department of Medicaid, the Financial Management Service, and the Ohio Department of Aging. Practical scenarios illustrated how these elements are applied to real‑world circumstances.\u003cbreak time=\"0.5s\"/>By understanding service options, caregiver recruitment, eligibility pathways, and agreement requirements, waiver service coordinators can support individuals in achieving greater choice, control, and flexibility through self‑direction. For additional information or questions, waiver service coordinators may reference the Service Sorting Chart, the Service Sorting Process Flow, and the Employer and Employee Agreement, or contact the Self‑Direction support team at the Ohio Department of Medicaid.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"This concludes the getting started with self-direction training.","startTime":0.129,"finishTime":3.21},{"text":"The lesson outlined how individuals choose self-directed services,","startTime":3.49,"finishTime":7},{"text":"described methods for identifying and recruiting caregivers,","startTime":7.53,"finishTime":10.399000000000001},{"text":"and detailed the employer and employee agreement that governs roles,","startTime":10.81,"finishTime":14.119},{"text":"expectations,","startTime":14.489,"finishTime":15.25},{"text":"and documentation.","startTime":15.329,"finishTime":16.549},{"text":"It distinguished aid and nursing service options","startTime":16.809,"finishTime":19.53},{"text":"across state plan and waiver services,","startTime":19.53,"finishTime":21.559},{"text":"clarified differences in service methodology.","startTime":21.959,"finishTime":24.45},{"text":"And explained pathways for caregiver eligibility and","startTime":24.84,"finishTime":27.879},{"text":"enrollment through the Ohio Department of Medicaid,","startTime":27.879,"finishTime":30.18},{"text":"the Financial Management Service,","startTime":30.719,"finishTime":32.319},{"text":"and the Ohio Department of Aging.","startTime":32.509,"finishTime":34.279},{"text":"Practical scenarios illustrated how these elements","startTime":34.549,"finishTime":37.24},{"text":"are applied to real world circumstances.","startTime":37.24,"finishTime":39.479},{"text":"By understanding service options,","startTime":40.419,"finishTime":42.169},{"text":"caregiver recruitment,","startTime":42.38,"finishTime":43.52},{"text":"eligibility pathways,","startTime":43.619,"finishTime":45.009},{"text":"and agreement requirements,","startTime":45.049,"finishTime":46.419},{"text":"waiver service coordinato h personal care, home care, and community access. They may replace comparable home health services because of differences in service methodology. Self-directed services can be provided by a parent, spouse, or family member in accordance with Ohio Administrative Code 51 60 44 32. Personal care aides in self-direction may enroll through the F M S, be approved through the O D M as a non-agency provider, or be certified through the Ohio Department of Aging as a consumer-directed personal care services provider. Self-directed caregivers cannot work for an agency because they are employed directly by the individual.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-OnyxTurboMultilingualNeural\",\"rate\":1}}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"Home health aide services under the state plan are typically part-time and intermittent, limited to four hours per visit and no more than eight hours per day. These services are provided only by Ohio Department of Medicaid-enrolled Medicare-certified home health agencies and generally cannot include transportation. In comparison, aide services available through self-direction under the waiver can be intermittent or continuous. These services include assistance with personal care, home care, and community access. They may replace comparable home health services because of differences in service methodology. Self-directed services can be provided by a parent, spouse, or family member in accordance with Ohio Administrative Code 51 60 44 32. Personal care aides in self-direction may enroll through the F M S, be approved through the O D M as a non-agency provider, or be certified through the Ohio Department of Aging as a consumer-directed personal care services provider. Self-directed caregivers cannot work for an agency because they are employed directly by the in
